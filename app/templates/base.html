<!doctype html>
<title>Timetable System</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 2rem;
    color: #222
  }

  table {
    border-collapse: collapse;
    width: 100%
  }

  td,
  th {
    border: 1px solid #ccc;
    padding: 6px;
    vertical-align: top;
    font-size: .85rem
  }

  th {
    background: #f3f3f3
  }

  nav a,
  nav button {
    margin-right: 1rem
  }

  form.f {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: end;
    margin-bottom: 1rem
  }

  form.f label {
    display: flex;
    flex-direction: column;
    font-size: .85rem
  }
</style>
{% include "nav.html" %}
{% for m in get_flashed_messages() %}<p><b>{{ m }}</b></p>{% endfor %}
{% block body %}{% endblock %}
